databases:
  - name: yomislo-db
    region: singapore
    plan: basic
    databaseName: yomislo_production
    user: yomislo

services:
  - type: web
    name: yomislo
    region: singapore
    runtime: ruby
    plan: starter
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yomislo-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      # Starter plan has 512MB RAM — run Puma in single mode (threads only).
      - key: WEB_CONCURRENCY
        value: "0"
      # Cap glibc malloc arenas (default is 8 × CPU cores). Multi-threaded
      # Ruby fragments RSS across arenas; limiting to 2 curbs memory growth
      # and prevents OOM restarts on the 512MB instance.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── 日次: DMMぱちタウン 機種+設置機種同期 ──
  # 03:00 JST (18:00 UTC前日) — 約5時間
  # ※毎月1日はスキップ (Job内判定、月次ジョブが代わりに実行)
  - type: cron
    name: yomislo-daily-refresh
    region: singapore
    runtime: ruby
    plan: starter
    schedule: "0 18 * * *"
    buildCommand: bundle install
    startCommand: bundle exec rails runner "DailyMachineRefreshJob.perform_now"
    envVars: &batch-env
      - key: DATABASE_URL
        fromDatabase:
          name: yomislo-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      # Cap glibc malloc arenas on the batch jobs too — the ~5h scraping runs
      # (Nokogiri parsing per page) accumulate RSS on the same 512MB instance.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: SENTRY_DSN
        sync: false

  # ── 日次: 軽量集計バッチ ──────────
  # ランキング + 収支集計 + VoterProfile — 04:00 JST (19:00 UTC前日)
  - type: cron
    name: yomislo-daily-aggregation
    region: singapore
    runtime: ruby
    plan: starter
    schedule: "0 19 * * *"
    buildCommand: bundle install
    startCommand: >
      bundle exec rails runner "
        VoterRanking.refresh_weekly!;
        VoterRanking.refresh_monthly!;
        VoterRanking.refresh_all_time!;
        PlayRecordSummary.refresh_all!;
        Vote.where(voted_on: 7.days.ago..Date.current).select(:voter_token).distinct.pluck(:voter_token).each { |t| VoterProfile.refresh_for(t) }
      " && bundle exec rails sitemap:refresh:no_ping
    envVars: *batch-env

  # ── 月次: DMMぱちタウン 店舗+機種+詳細+設置機種フル同期 ──
  # UTC 1〜5日 18:00 = JST 2〜6日 03:00 起動。
  # 設置機種のフル同期だけで 6,053店舗 × 約6秒 ≒ 10時間かかり Render の cron 上限 12時間に
  # 収まらないため、MonthlySyncProgress の都道府県チェックポイントで複数日に分けて完了させる。
  # MonthlyShopDetailsJob::JOB_TIME_BUDGET が1回の実行を 10.5時間で自主終了させる。
  - type: cron
    name: yomislo-monthly
    region: singapore
    runtime: ruby
    plan: starter
    schedule: "0 18 1-5 * *"
    buildCommand: bundle install
    startCommand: bundle exec rails runner "MonthlyShopDetailsJob.perform_now"
    envVars: *batch-env
